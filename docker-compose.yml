services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marigold
      POSTGRES_PASSWORD: marigold
      POSTGRES_DB: marigold
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marigold -d marigold"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  site:
    build:
      context: ./site
      target: build
    volumes:
      - site-dist:/dist_out
    command: sh -c "rm -rf /dist_out/* && cp -r /app/dist/. /dist_out/"

  site-dev:
    build:
      context: ./site
      target: dev
    volumes:
      - ./site:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    profiles: ["dev"]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - site-dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      site:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  site-dist:
  postgres-data:
