services:
  site:
    build:
      context: ./site
      target: build
    volumes:
      - site-dist:/dist_out
    command: sh -c "rm -rf /dist_out/* && cp -r /app/dist/. /dist_out/"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - site-dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      site:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  site-dist:
